{% extends "base/base.html" %}
{% block content %}
<div class="max-w-2xl">
  <div class="flex items-center gap-3 mb-6">
    <a href="{% url 'crm:lead_list' %}" class="p-2 rounded-lg hover:bg-gray-100 text-gray-500">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </a>
    <h1 class="text-xl font-bold text-gray-900">{{ page_title }}</h1>
  </div>

  <form method="post" class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700">{{ form.non_field_errors }}</div>{% endif %}

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Lead Name *</label>
        <input type="text" name="{{ form.name.html_name }}" value="{{ form.name.value|default:'' }}"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Company</label>
        <input type="text" name="{{ form.company_name.html_name }}" value="{{ form.company_name.value|default:'' }}"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Phone</label>
        <input type="text" name="{{ form.phone.html_name }}" value="{{ form.phone.value|default:'' }}"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Email</label>
        <input type="email" name="{{ form.email.html_name }}" value="{{ form.email.value|default:'' }}"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Status</label>
        <select name="{{ form.status.html_name }}" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-primary/30">
          {% for val, label in form.status.field.choices %}
            <option value="{{ val }}" {% if form.status.value == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Source</label>
        <input type="text" name="{{ form.source.html_name }}" value="{{ form.source.value|default:'' }}"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30"
          placeholder="Referral, Website, Walk-in...">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Estimated Value</label>
        <input type="number" name="{{ form.estimated_value.html_name }}" value="{{ form.estimated_value.value|default:'' }}"
          step="0.01" min="0"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30 font-mono">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Expected Close</label>
        <input type="date" name="{{ form.expected_close_date.html_name }}" value="{{ form.expected_close_date.value|default:'' }}"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Notes</label>
      <textarea name="{{ form.notes.html_name }}" rows="3"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30 resize-none">{{ form.notes.value|default:'' }}</textarea>
    </div>

    <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
      <a href="{% url 'crm:lead_list' %}" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancel</a>
      <button type="submit" class="px-5 py-2 text-sm font-medium text-white rounded-lg" style="background:var(--primary)">{{ action }}</button>
    </div>
  </form>
</div>
{% endblock %}
