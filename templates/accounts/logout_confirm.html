{% extends "base/base.html" %}
{% block content %}
<div class="flex min-h-[50vh] items-center justify-center">
  <div class="card w-full max-w-sm p-7 text-center">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-xl bg-surface-3 text-ink-2">
      {% include "_includes/icon.html" with name="logout" cls="h-6 w-6" %}
    </div>
    <h1 class="text-lg font-bold text-ink">Sign out of Mofisi?</h1>
    <p class="mb-5 mt-1 text-sm text-ink-muted">You'll need your email and password to sign back in.</p>
    <form method="post" action="{% url 'accounts:logout' %}" class="no-card">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary btn-block">Sign out</button>
    </form>
    <a href="{% url 'dashboard:index' %}" class="btn btn-ghost btn-block mt-2">Stay signed in</a>
  </div>
</div>
{% endblock %}
