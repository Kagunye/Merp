<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — MERP ERP</title>
  <script src="https://cdn.tailwindcss.com/3.4.4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="min-h-screen flex items-center justify-center" style="background:#F5F6F8">
  <div class="w-full max-w-md p-8">
    <div class="bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">
      <h1 class="text-xl font-bold text-gray-900 mb-6">Set New Password</h1>
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">New Password</label>
          <input type="password" name="password" placeholder="Minimum 8 characters"
                 class="w-full px-4 py-3 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2"
                 style="--tw-ring-color:#C8102E;">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirm Password</label>
          <input type="password" name="password_confirm" placeholder="Repeat password"
                 class="w-full px-4 py-3 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2"
                 style="--tw-ring-color:#C8102E;">
        </div>
        <button type="submit" class="w-full py-3 text-sm font-semibold text-white rounded-xl" style="background:#C8102E">
          Reset Password
        </button>
      </form>
    </div>
  </div>
</body>
</html>
