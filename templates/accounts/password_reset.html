<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset — MERP ERP</title>
  <script src="https://cdn.tailwindcss.com/3.4.4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}</style>
</head>
<body class="min-h-screen flex items-center justify-center" style="background:#F5F6F8">
  <div class="w-full max-w-md p-8">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center mx-auto mb-4" style="background:#C8102E">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Reset Password</h1>
      <p class="text-gray-500 text-sm mt-1">Enter your email to receive a reset link</p>
    </div>
    <div class="bg-white rounded-2xl border border-gray-200 p-8 shadow-sm">
      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Email address</label>
          <input type="email" name="email" placeholder="you@company.com" autofocus
                 class="w-full px-4 py-3 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:border-transparent"
                 style="--tw-ring-color:#C8102E;">
        </div>
        <button type="submit" class="w-full py-3 text-sm font-semibold text-white rounded-xl" style="background:#C8102E">
          Send Reset Link
        </button>
      </form>
      <p class="text-center text-sm text-gray-500 mt-4">
        <a href="{% url 'accounts:login' %}" style="color:#C8102E" class="font-medium hover:underline">← Back to login</a>
      </p>
    </div>
  </div>
</body>
</html>
