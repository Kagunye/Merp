{% extends "base/base.html" %}
{% block content %}
<div class="max-w-xl">
  <div class="flex items-center gap-3 mb-6">
    <a href="{% url 'inventory:movement_list' %}" class="p-2 rounded-lg hover:bg-gray-100 text-gray-500">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    </a>
    <h1 class="text-xl font-bold text-gray-900">{{ page_title }}</h1>
  </div>

  <form method="post" class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
    {% csrf_token %}

    {% if form.non_field_errors %}
    <div class="bg-red-50 border border-red-200 rounded-lg p-3 text-sm text-red-700">{{ form.non_field_errors }}</div>
    {% endif %}

    <div>
      <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Product *</label>
      <select name="{{ form.product.html_name }}" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-primary/30">
        <option value="">— Select product</option>
        {% for p in form.product.field.queryset %}
          <option value="{{ p.pk }}" {% if form.product.value|stringformat:"s" == p.pk|stringformat:"s" %}selected{% endif %}>{{ p.sku }} — {{ p.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Warehouse *</label>
      <select name="{{ form.warehouse.html_name }}" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-primary/30">
        {% for w in form.warehouse.field.queryset %}
          <option value="{{ w.pk }}" {% if form.warehouse.value|stringformat:"s" == w.pk|stringformat:"s" %}selected{% endif %}>{{ w.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Movement Type *</label>
        <select name="{{ form.movement_type.html_name }}" class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-primary/30">
          {% for val, label in form.movement_type.field.choices %}
            <option value="{{ val }}" {% if form.movement_type.value == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Date *</label>
        <input type="date" name="{{ form.movement_date.html_name }}" value="{{ form.movement_date.value|default:'' }}"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Quantity *</label>
        <input type="number" name="{{ form.quantity.html_name }}" value="{{ form.quantity.value|default:'' }}"
          step="0.0001" min="0.0001"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30 font-mono">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Unit Cost</label>
        <input type="number" name="{{ form.unit_cost.html_name }}" value="{{ form.unit_cost.value|default:'0' }}"
          step="0.0001" min="0"
          class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30 font-mono">
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Reference</label>
      <input type="text" name="{{ form.reference.html_name }}" value="{{ form.reference.value|default:'' }}"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30"
        placeholder="PO-001, optional">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Notes</label>
      <textarea name="{{ form.notes.html_name }}" rows="2"
        class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/30 resize-none"></textarea>
    </div>

    <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
      <a href="{% url 'inventory:movement_list' %}" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancel</a>
      <button type="submit" class="px-5 py-2 text-sm font-medium text-white rounded-lg" style="background:var(--primary)">Record Adjustment</button>
    </div>
  </form>
</div>
{% endblock %}
