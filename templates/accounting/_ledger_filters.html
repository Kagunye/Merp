<div class="form-field">
  <label for="id_from" class="form-label">From</label>
  <input id="id_from" type="date" name="from" value="{{ from_date|date:'Y-m-d' }}" class="input">
</div>
<div class="form-field">
  <label for="id_to" class="form-label">To</label>
  <input id="id_to" type="date" name="to" value="{{ to_date|date:'Y-m-d' }}" class="input">
</div>
