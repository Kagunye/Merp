{# Status select for a filter_bar: needs status_choices and status_filter; the GET name stays "status". #}
<div class="form-field">
  <label class="form-label" for="fb-status">Status</label>
  <select id="fb-status" name="status" class="select">
    <option value="">All statuses</option>
    {% for val, label in status_choices %}
    <option value="{{ val }}"{% if status_filter == val %} selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</div>
