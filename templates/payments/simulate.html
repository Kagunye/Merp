<!DOCTYPE html>
{% load ui_extras %}
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice checkout</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; background: #f4f5f7; margin: 0; display: grid; place-items: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
    .box { background: #fff; border-radius: 16px; padding: 28px; max-width: 420px; width: 100%; box-shadow: 0 2px 12px rgb(0 0 0 / .08); }
    .tag { display: inline-block; background: #fff4d6; color: #7a5200; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
    button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 0; font-size: 16px; font-weight: 700; cursor: pointer; }
    .pay { background: #16794c; color: #fff; } .fail { background: #eee; color: #333; }
  </style>
</head>
<body>
  <form class="box" method="post">
    <span class="tag">Simulator: no money moves</span>
    <h1 style="font-size:22px;margin:12px 0 4px">{{ req.gateway.get_provider_display }} checkout</h1>
    <p style="margin:0;color:#444">{{ req.description }}</p>
    <p style="font-size:28px;font-weight:800;margin:14px 0">{{ req.currency }} {{ req.amount|money }}</p>
    <button class="pay" name="result" value="PAID">Pay (practice)</button>
    <button class="fail" name="result" value="FAILED">Decline</button>
  </form>
</body>
</html>
