{% extends "base/base.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center py-20 text-center">
  <div class="w-20 h-20 rounded-2xl bg-gray-100 flex items-center justify-center mb-6">
    <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
    </svg>
  </div>
  <h2 class="text-xl font-bold text-gray-900 mb-2">{{ page_title }} Module</h2>
  <p class="text-gray-500 max-w-md">This module is being built. Core functionality will be available soon.</p>
  <a href="{% url 'dashboard:index' %}" class="mt-6 px-5 py-2.5 text-sm font-medium text-white rounded-lg" style="background: var(--primary)">
    Back to Dashboard
  </a>
</div>
{% endblock %}
