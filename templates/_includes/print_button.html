{% comment %}
Print control. `.no-print` plus the base print stylesheet keep the button
itself off the page it prints. Pass `print_label` to override the caption.
{% endcomment %}
<button type="button" onclick="window.print()"
        class="no-print inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2m0 0v4H6v-4h12z"/>
  </svg>
  {{ print_label|default:"Print" }}
</button>
