{% comment %}
Print control. `.no-print` plus the base print stylesheet keep the button
itself off the page it prints. Pass `print_label` to override the caption.
{% endcomment %}
<button type="button" onclick="window.print()" class="no-print btn btn-secondary" aria-label="{{ print_label|default:'Print' }} this page">
  {% include "_includes/icon.html" with name="printer" cls="h-4 w-4" %}
  <span class="hidden sm:inline">{{ print_label|default:"Print" }}</span>
</button>
