{% extends "base/base.html" %}
{% block title %}{{ page_title }} — MERP ERP{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold text-gray-900">{{ page_title }}</h1>
  <a href="{% url 'projects:project_list' %}" class="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
</div>
<form method="post" class="max-w-2xl">
  {% csrf_token %}
  <div class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
    {% for field in form %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}</label>
      {{ field }}
      {% if field.errors %}<p class="text-red-500 text-xs mt-1">{{ field.errors|join:", " }}</p>{% endif %}
    </div>
    {% endfor %}
  </div>
  <div class="mt-6 flex gap-3">
    <button type="submit" class="px-6 py-2.5 rounded-lg text-sm font-semibold text-white" style="background:var(--primary)">Save Project</button>
    <a href="{% url 'projects:project_list' %}" class="px-6 py-2.5 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50">Cancel</a>
  </div>
</form>
{% endblock %}
