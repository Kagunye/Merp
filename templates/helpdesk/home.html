{% extends "base/base.html" %}
{% block content %}
{% include "_includes/launcher.html" with launcher_title="Help Desk" launcher_subtitle="Customer support tickets and resolutions" launcher_bar="#1D4ED8" %}

<div class="launcher-section-label">Processing</div>
<div class="launcher-grid">
  <a href="{% url 'helpdesk:ticket_create' %}" class="launcher-tile"><div class="ico ico-mint">🎫</div><span class="label">New Ticket</span></a>
  <a href="{% url 'helpdesk:ticket_list' %}?status=OPEN" class="launcher-tile"><div class="ico ico-rose">🔥</div><span class="label">Open Tickets</span></a>
</div>

<div class="launcher-section-label">Lists</div>
<div class="launcher-grid">
  <a href="{% url 'helpdesk:ticket_list' %}" class="launcher-tile"><div class="ico ico-sky">📋</div><span class="label">All Tickets</span></a>
  <a href="{% url 'crm:customer_list' %}" class="launcher-tile"><div class="ico ico-slate">👤</div><span class="label">Customers</span></a>
</div>
